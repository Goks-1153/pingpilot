<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PingPilot · Growth POC live status</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f4f6fb;color:#1d2433;overflow-x:hidden}
header{background:#111;color:#fff;padding:14px 16px;position:relative}
header h1{margin:0 0 6px;font-size:20px;padding-right:70px}.live{position:absolute;top:14px;right:16px;color:#ff3b3b;font-weight:700;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:#ff3b3b;animation:b 1s infinite}@keyframes b{50%{opacity:.15}}
.hrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:#ccc}
#refresh{background:#2d7ff9;color:#fff;border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer}
#prog{display:none;flex:1;min-width:140px;background:#333;border-radius:6px;height:18px;position:relative;overflow:hidden}#bar{height:100%;width:0;background:#2ecc71;transition:width .15s}#pct{position:absolute;inset:0;text-align:center;font-size:12px;line-height:18px;color:#fff}
main{max-width:1100px;margin:auto;padding:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.card{border-radius:10px;padding:12px;color:#fff}.card b{font-size:26px;display:block}
h2{font-size:17px;margin:20px 0 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{flex:1;min-width:70px;border:0;border-radius:8px;padding:10px;font-weight:700;color:#fff;cursor:pointer;opacity:.75}.tab.on{opacity:1;box-shadow:0 0 0 3px #1113}
.panel{background:#fff;border-radius:10px;padding:12px;margin-top:8px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#eef2ff;border-radius:14px;padding:4px 10px;font-size:13px}
ul{margin:6px 0;padding-left:18px}li{margin:3px 0;font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}select{padding:6px;border-radius:6px;border:1px solid #ccd}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:14px}th,td{padding:8px;text-align:left;border-bottom:1px solid #eef;vertical-align:top}th{background:#e8ecf7}
.pill{display:inline-block;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:700;color:#fff}.High{background:#e53935}.Med{background:#fb8c00}.Low{background:#43a047}.Open{background:#1e88e5}.Closed{background:#757575}
.fb button{font-size:12px;margin:2px;padding:3px 7px;border-radius:5px;border:1px solid #bbc;background:#fff;cursor:pointer}.fbbox{display:none;margin-top:4px}.fbbox textarea{width:100%;min-height:50px}.ctx{font-size:12px;color:#555;margin-top:3px}
.note{font-size:12px;color:#666}footer{font-size:12px;color:#666;text-align:center;padding:16px}
@media(max-width:640px){thead{display:none}tr{display:block;background:#fff;margin-bottom:8px;border-radius:8px;padding:6px}td{display:block;border:0;padding:3px 6px}td::before{content:attr(data-l)": ";font-weight:600;color:#667}}
</style></head><body>
<header><div class="live"><span class="dot"></span>Live</div><h1>PingPilot · Growth POC status</h1>
<div class="hrow"><button id="refresh" title="Loads the latest scraped data">⟳ Refresh</button><div id="prog"><div id="bar"></div><div id="pct">0%</div></div><span id="upd">Last updated: —</span></div></header>
<main>
<div class="cards" id="cards"></div>
<h2>POCs</h2><div class="tabs" id="tabs"></div><div id="panel"></div>
<h2>Open asks & pending items</h2>
<div class="filters"><select id="fp"><option value="">All POCs</option></select><select id="fr"><option value="">All priorities</option><option>High</option><option>Med</option><option>Low</option></select><select id="fs"><option value="">All status</option><option>Open</option><option>Closed</option></select>
<button id="exp">Export feedback</button></div>
<p class="note">Feedback is saved on this device; export to share.</p>
<table><thead><tr><th>Creator</th><th>POC</th><th>Item</th><th>Risk</th><th>Status</th><th>Feedback</th></tr></thead><tbody id="tb"></tbody></table>
<h2>Common themes</h2><ul id="themes"></ul>
</main><footer>Updates & usage: <span id="usage">—</span> · Read-only, each creator credited to CRM Growth POC only.</footer>
<script>
const COL={Sid:'#7e57c2',Natasha:'#ec407a',Divya:'#26a69a',Kishore:'#ff7043'};let D=null,open=null,FB={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function loadFB(){try{FB=JSON.parse(localStorage.getItem('ppfb')||'{}')}catch(e){FB={}}}
function saveFB(){localStorage.setItem('ppfb',JSON.stringify(FB))}
function st(r){const f=FB[r.id]||FB['m:'+r.poc+':'+r.creator];return f&&f.fixed?'Closed':r.status}
function render(){const R=D.rows;
document.getElementById('upd').textContent='Last updated: '+new Date(D.lastUpdated).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'})+' IST';
const o=R.filter(r=>st(r)=='Open'),c=(f)=>o.filter(f).length;
const cards=[['Creators at risk',c(r=>r.flag=='At risk'),'#e53935'],['Open items',o.length,'#1e88e5'],['Payments open',c(r=>r.cat=='Payment'),'#8e24aa'],['Scripts / approvals',c(r=>r.cat=='Script'||r.cat=='Approval'),'#fb8c00'],['Not found',c(r=>r.flag=='Not found'),'#546e7a']];
document.getElementById('cards').innerHTML=cards.map(x=>`<div class="card" style="background:${x[2]}"><b>${x[1]}</b>${x[0]}</div>`).join('');
const P=Object.keys(D.kpis);document.getElementById('tabs').innerHTML=P.map(p=>`<button class="tab ${open==p?'on':''}" style="background:${COL[p]}" onclick="tog('${p}')">${p}</button>`).join('');
const fp=document.getElementById('fp');if(fp.options.length<2)P.forEach(p=>fp.add(new Option(p)));
let pn='';if(open){const k=D.kpis[open],rr=R.filter(r=>r.poc==open),cr=[...new Set(rr.map(r=>r.creator))];
const li=(f)=>rr.filter(f).map(r=>`<li><b>${esc(r.creator)}</b>: ${esc(r.item)}</li>`).join('')||'<li>None</li>';
pn=`<div class="panel" style="border-top:5px solid ${COL[open]}"><div class="chips"><span class="chip">Owned ${k.owned}</span><span class="chip">Active ${k.active}</span><span class="chip">Not found ${k.notFound}</span><span class="chip">CRM deals ${k.deals} (${k.dealValue})</span><span class="chip">Open asks ${k.openAsks}</span><span class="chip">At risk ${k.atRisk}</span></div>${k.note?`<p class="note">${esc(k.note)}</p>`:''}
<h3>⚠ At risk</h3><ul>${li(r=>r.flag=='At risk')}</ul><h3>₹ Payments</h3><ul>${li(r=>r.cat=='Payment')}</ul><h3>❓ Not found</h3><ul>${li(r=>r.flag=='Not found')}</ul><h3>👥 Creators (${cr.length})</h3><div class="chips">${cr.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`}
document.getElementById('panel').innerHTML=pn;
const v=[fp.value,document.getElementById('fr').value,document.getElementById('fs').value];
document.getElementById('tb').innerHTML=R.filter(r=>(!v[0]||r.poc==v[0])&&(!v[1]||r.priority==v[1])&&(!v[2]||st(r)==v[2])).map(r=>{const f=FB[r.id]||{},s=st(r);
return `<tr><td data-l="Creator">${esc(r.creator)}</td><td data-l="POC">${r.poc}</td><td data-l="Item">${esc(r.item)}</td><td data-l="Risk"><span class="pill ${r.priority}">${r.priority}</span></td><td data-l="Status"><span class="pill ${s}">${s}</span></td>
<td data-l="Feedback" class="fb"><button onclick="fix('${r.id}')">${s=='Closed'?'Reopen':'Mark fixed'}</button><button onclick="this.parentNode.querySelector('.fbbox').style.display='block'">Add context</button>
<div class="fbbox"><textarea placeholder="e.g. discussed in internal group">${esc(f.context||'')}</textarea><label><input type="radio" name="s${r.id}" value="item" ${f.scope!='month'?'checked':''}> this item only</label> <label><input type="radio" name="s${r.id}" value="month" ${f.scope=='month'?'checked':''}> whole month for this creator</label><br><button onclick="ctx('${r.id}',this)">Save</button></div>${f.context?`<div class="ctx">📝 ${esc(f.context)} (${f.scope=='month'?'whole month':'this item'})</div>`:''}</td></tr>`}).join('');
document.getElementById('themes').innerHTML=D.themes.slice(0,6).map(t=>`<li>${esc(t)}</li>`).join('');}
function tog(p){open=open==p?null:p;render()}
function rowOf(id){return D.rows.find(r=>r.id==id)}
function fix(id){const f=FB[id]=FB[id]||{};f.fixed=!f.fixed;f.at=new Date().toISOString();if(f.scope=='month'){const r=rowOf(id);FB['m:'+r.poc+':'+r.creator]={fixed:f.fixed}}saveFB();render()}
function ctx(id,b){const box=b.parentNode,f=FB[id]=FB[id]||{};f.context=box.querySelector('textarea').value;f.scope=box.querySelector('input:checked').value;f.at=new Date().toISOString();saveFB();render()}
document.getElementById('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(FB,null,1)],{type:'application/json'}));a.download='feedback.json';a.click()};
['fp','fr','fs'].forEach(i=>document.getElementById(i).onchange=render);
async function fetchProg(url,on){const r=await fetch(url,{cache:'no-store'});const tot=+r.headers.get('content-length')||0;if(!r.body||!tot){on(60);return r.json()}
const rd=r.body.getReader();let got=0,ch=[];for(;;){const{done,value}=await rd.read();if(done)break;ch.push(value);got+=value.length;on(Math.min(95,got/tot*95))}
return JSON.parse(new TextDecoder().decode(await new Blob(ch).arrayBuffer()))}
async function load(prog){const nd=await fetchProg('data.json?t='+Date.now(),prog);D=nd}
document.getElementById('refresh').onclick=async()=>{const pg=document.getElementById('prog'),bar=document.getElementById('bar'),pc=document.getElementById('pct');pg.style.display='block';
const set=p=>{bar.style.width=p+'%';pc.textContent=Math.round(p)+'%'};set(0);try{await load(set);for(let p=parseFloat(bar.style.width)||0;p<100;p+=5){set(p);await new Promise(r=>setTimeout(r,40))}set(100);render()}catch(e){pc.textContent='Failed'}setTimeout(()=>pg.style.display='none',800)};
(async()=>{loadFB();try{const ext=await (await fetch('feedback.json',{cache:'no-store'})).json();for(const k in ext)if(!FB[k])FB[k]=ext[k]}catch(e){}
await load(()=>{});render();
try{const u=await (await fetch('usage.json?t='+Date.now())).json();if(u.runs&&u.runs.length){const l=u.runs[u.runs.length-1];document.getElementById('usage').textContent=`${u.runs.length} runs · last ${l.at||'—'} · tokens ${l.tokens??'—'}`}}catch(e){}})();
</script></body></html>
